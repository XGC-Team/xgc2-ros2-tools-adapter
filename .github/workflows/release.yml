name: release

# Product workflows build trusted artifacts only. Central xgc2-devops owns all
# APT repository staging, approval, publication, and rollback.
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected immutable source commit SHA
        required: true
        type: string
      prepare_action:
        description: Release-train action
        required: true
        type: choice
        options: [release, compatibility-verify]
      apt_overlay_url:
        description: Optional release-scoped staging APT base URL
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of the exact release-train dependency set
        required: true
        type: string
      run_cpp_quality:
        description: Run the dedicated C++ quality job
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run the dedicated source-test job
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
  ADAPTER_RUNTIME_CLIENT_DEB_VERSION: ${{ inputs.apt_overlay_url == '' && '0.6.0-8~noble' || '' }}
  XGC2_PROTOBUF_DEB_VERSION: ${{ inputs.apt_overlay_url == '' && '0.5.0-11~noble' || '' }}

jobs:
  prepare-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release-train inputs
        env:
          PREPARE_ACTION: ${{ inputs.prepare_action }}
          APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
          DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
        run: |
          set -euo pipefail
          case "$PREPARE_ACTION" in
            release|compatibility-verify) ;;
            *) echo "unsupported prepare_action: $PREPARE_ACTION" >&2; exit 1 ;;
          esac
          [[ "$DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
            echo "dependency_set_digest must be 64 lowercase hexadecimal characters" >&2
            exit 1
          }
          safe_https_url='^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~%+:/=-]*)?$'
          if [[ -n "$APT_OVERLAY_URL" &&
                ( "$APT_OVERLAY_URL" =~ [[:space:][:cntrl:]] ||
                  ! "$APT_OVERLAY_URL" =~ $safe_https_url ) ]]; then
            echo "apt_overlay_url must be a strict HTTPS URL" >&2
            exit 1
          fi
          if [[ "$PREPARE_ACTION" == compatibility-verify && -z "$APT_OVERLAY_URL" ]]; then
            echo "compatibility-verify requires apt_overlay_url" >&2
            exit 1
          fi

  release-guard:
    needs: prepare-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate immutable release identity
        run: |
          set -euo pipefail
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          test "$product_version" = "${{ inputs.expected_version }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_source_sha }}"

  compliance:
    needs: release-guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run release compliance
        run: |
          set -euo pipefail
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  cpp-quality:
    if: ${{ inputs.run_cpp_quality }}
    needs: release-guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run C++ quality in Jazzy
        run: |
          set -euo pipefail
          docker run --rm \
            -e ADAPTER_RUNTIME_CLIENT_DEB_VERSION \
            -e XGC2_APT_OVERLAY_URL \
            -e XGC2_PROTOBUF_DEB_VERSION \
            -v "$GITHUB_WORKSPACE:/workspace/source:ro" \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-ros-jazzy:1.0.0 bash -lc '
              set -euo pipefail
              /workspace/source/.xgc2/scripts/configure_xgc2_apt.sh noble
              runtime_package=libxgc2-adapter-runtime-client-dev
              protobuf_package=xgc2-protobuf-dev
              [[ -z "$ADAPTER_RUNTIME_CLIENT_DEB_VERSION" ]] || \
                runtime_package="${runtime_package}=${ADAPTER_RUNTIME_CLIENT_DEB_VERSION}"
              [[ -z "$XGC2_PROTOBUF_DEB_VERSION" ]] || \
                protobuf_package="${protobuf_package}=${XGC2_PROTOBUF_DEB_VERSION}"
              apt-get install -y --no-install-recommends \
                "$runtime_package" "$protobuf_package"
              set +u
              source /opt/ros/jazzy/setup.bash
              set -u
              /workspace/source/.xgc2/scripts/check_cpp_quality.sh \
                --work-dir /tmp/xgc2-ros2-tools-adapter-quality
            '

  source-tests:
    if: ${{ inputs.run_source_tests }}
    needs: release-guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run source tests in Jazzy
        run: |
          set -euo pipefail
          docker run --rm \
            -e ADAPTER_RUNTIME_CLIENT_DEB_VERSION \
            -e XGC2_APT_OVERLAY_URL \
            -e XGC2_PROTOBUF_DEB_VERSION \
            -v "$GITHUB_WORKSPACE:/workspace/source:ro" \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-ros-jazzy:1.0.0 bash -lc '
              set -euo pipefail
              /workspace/source/.xgc2/scripts/configure_xgc2_apt.sh noble
              runtime_package=libxgc2-adapter-runtime-client-dev
              protobuf_package=xgc2-protobuf-dev
              [[ -z "$ADAPTER_RUNTIME_CLIENT_DEB_VERSION" ]] || \
                runtime_package="${runtime_package}=${ADAPTER_RUNTIME_CLIENT_DEB_VERSION}"
              [[ -z "$XGC2_PROTOBUF_DEB_VERSION" ]] || \
                protobuf_package="${protobuf_package}=${XGC2_PROTOBUF_DEB_VERSION}"
              apt-get install -y --no-install-recommends \
                "$runtime_package" "$protobuf_package"
              set +u
              source /opt/ros/jazzy/setup.bash
              set -u
              /workspace/source/.xgc2/scripts/check_cpp_quality.sh \
                --work-dir /tmp/xgc2-ros2-tools-adapter-tests
            '

  build:
    name: package-tests-debs-${{ matrix.arch }}
    needs: release-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build, test, package, install, and inspect
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          PREPARE_ACTION: ${{ inputs.prepare_action }}
        run: |
          set -euo pipefail
          install -d .ci/build-manifests
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/xgc2-ros2-tools-adapter-release-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"
      - name: Create and verify release-train build manifest
        run: |
          set -euo pipefail
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-ros2-tools-adapter \
            --expected-package ros-jazzy-xgc2-ros2-tools-adapter \
            --product-version "${{ inputs.expected_version }}" \
            --distribution noble \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir . \
            --deb-output-dir .ci/verified-debs \
            --manifest-output-dir .ci/verified-manifests \
            --product xgc2-ros2-tools-adapter \
            --expected-package ros-jazzy-xgc2-ros2-tools-adapter \
            --product-version "${{ inputs.expected_version }}" \
            --distribution noble \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID"
      - name: Upload trusted build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xgc2-ros2-tools-adapter-noble-${{ matrix.arch }}
          path: |
            debs/*.deb
            debs/xgc2-dependency-evidence.json
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
